<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>半場戰術板</title>
  </head>
  <body data-screen="home">
    <!-- 首頁：選模式 -->
    <section id="home" class="screen home" aria-labelledby="home-title">
      <div class="home__inner">
        <h1 id="home-title" class="home__title">半場戰術板</h1>
        <p class="home__sub">3 對 3 半場籃球戰術</p>
        <button id="mode-offense" class="mode-card" type="button">
          <span class="mode-card__title">進攻模式</span>
          <span class="mode-card__desc">設定你的球隊，選擇或設計進攻戰術，系統負責防守</span>
        </button>
        <button class="mode-card" type="button" disabled>
          <span class="mode-card__title">防守模式</span>
          <span class="mode-card__desc">即將推出</span>
        </button>
      </div>
    </section>

    <!-- 設定流程：① 藍隊 ② 紅隊 ③ 對位 -->
    <section id="setup" class="screen setup" aria-labelledby="setup-title">
      <header class="setup__head">
        <p id="setup-progress" class="setup__progress">1 / 3</p>
        <!-- 從戰術面板進來時，改用分頁直接切換 -->
        <div id="setup-tabs" class="tabs" role="tablist" aria-label="球隊設定">
          <button class="tabs__tab" type="button" role="tab" data-step="1">藍隊</button>
          <button class="tabs__tab" type="button" role="tab" data-step="2">紅隊</button>
          <button class="tabs__tab" type="button" role="tab" data-step="3">對位</button>
        </div>
        <h2 id="setup-title" class="setup__title"></h2>
        <p id="setup-hint" class="setup__hint"></p>
      </header>
      <form id="setup-form" class="setup__body" novalidate></form>
      <footer class="setup__foot">
        <p id="setup-error" class="setup__error" role="alert" hidden></p>
        <div class="setup__actions">
          <button id="setup-back" class="btn" type="button">上一步</button>
          <span class="toolbar__spacer"></span>
          <button id="setup-skip" class="btn" type="button">略過</button>
          <button id="setup-next" class="btn btn--primary" type="button">下一步</button>
        </div>
      </footer>
    </section>

    <div class="app screen">
      <!-- 直式在上方，橫式在左側 -->
      <nav class="toolbar toolbar--primary" aria-label="主要工具">
        <button class="tool" type="button" data-tip="戰術列表（即將推出）" aria-label="戰術列表" disabled>
          <svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        </button>
        <button id="library" class="tool" type="button" data-tip="戰術庫：推薦戰術、內建戰術、空白戰術" aria-label="戰術庫">
          <svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h7M9 11h5"/></svg>
        </button>
        <button id="play" class="tool" type="button" data-tip="播放（空白鍵）" aria-label="播放">
          <svg viewBox="0 0 24 24"><use href="#icon-play"/></svg>
        </button>
        <button id="team" class="tool" type="button" data-tip="球隊設定：藍隊、紅隊、對位" aria-label="球隊設定">
          <svg viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </button>
        <span class="toolbar__spacer"></span>
        <button class="tool" type="button" data-tip="分享（即將推出）" aria-label="分享" disabled>
          <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
        </button>
        <button class="tool" type="button" data-tip="存檔（即將推出）" aria-label="存檔" disabled>
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        </button>
        <button class="tool" type="button" data-tip="設定（即將推出）" aria-label="設定" disabled>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/></svg>
        </button>
      </nav>

      <main id="stage" class="stage">
        <canvas id="court" aria-label="半場球場，可以拖曳藍隊球員與球"></canvas>
        <div id="board-title" class="board-title" hidden></div>
        <div id="hud" class="hud" aria-live="polite"></div>
      </main>

      <!-- 直式在下方，橫式在右側 -->
      <nav class="toolbar toolbar--edit" aria-label="編輯工具">
        <button id="undo" class="tool tool--boxed" type="button" data-tip="復原（⌘Z / Ctrl+Z）" aria-label="復原" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="redo" class="tool tool--boxed" type="button" data-tip="重做（⇧⌘Z / Ctrl+Y）" aria-label="重做" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="toolbar__spacer"></span>
        <div class="frames" role="group" aria-label="分鏡">
          <button id="frame-prev" class="frames__btn" type="button" data-tip="上一個分鏡（←）" aria-label="上一個分鏡">‹</button>
          <button id="frame-label" class="frames__label" type="button" aria-haspopup="menu" aria-expanded="false" data-tip="分鏡選單：刪除這個分鏡">1 / 1</button>
          <button id="frame-next" class="frames__btn" type="button" data-tip="下一個分鏡（→）" aria-label="下一個分鏡">›</button>
          <button id="frame-add" class="frames__btn" type="button" data-tip="在後面新增分鏡" aria-label="在後面新增分鏡">＋</button>
        </div>
        <span class="toolbar__spacer"></span>
        <button id="tool" class="tool tool--boxed" type="button" data-tip="工具：移動" aria-label="工具：移動" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><use href="#icon-move"/></svg>
          <span class="tool__badge" hidden>
            <svg viewBox="0 0 24 24"><use href="#icon-freehand"/></svg>
          </span>
        </button>
        <button id="delete" class="tool tool--boxed" type="button" data-tip="刪除選取的路線（Delete）" aria-label="刪除路線" disabled>
          <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </nav>
    </div>
    <div id="tool-menu" class="menu" role="menu" aria-label="工具" hidden>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="move">
        <svg viewBox="0 0 24 24"><use href="#icon-move"/></svg>移動
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="cut">
        <svg viewBox="0 0 24 24"><use href="#icon-cut"/></svg>跑位
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="dribble">
        <svg viewBox="0 0 24 24"><use href="#icon-dribble"/></svg>運球
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="pass">
        <svg viewBox="0 0 24 24"><use href="#icon-pass"/></svg>傳球
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="screen">
        <svg viewBox="0 0 24 24"><use href="#icon-screen"/></svg>掩護
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="shot">
        <svg viewBox="0 0 24 24"><use href="#icon-shot"/></svg>投籃
      </button>
      <hr class="menu__sep" />
      <button class="menu__item" type="button" role="menuitemcheckbox" data-freehand>
        <svg viewBox="0 0 24 24"><use href="#icon-freehand"/></svg>手繪
      </button>
    </div>

    <div id="frame-menu" class="menu" role="menu" aria-label="分鏡" hidden>
      <button id="frame-delete" class="menu__item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>刪除這個分鏡
      </button>
    </div>

    <dialog id="library-dialog" class="panel" aria-labelledby="library-title">
      <div class="panel__head">
        <h2 id="library-title" class="panel__title">戰術庫</h2>
        <button id="library-close" class="btn" type="button">關閉</button>
      </div>
      <div id="library-body" class="panel__body"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- 工具圖示 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icon-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></symbol>
      <symbol id="icon-move" viewBox="0 0 24 24"><path d="m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></symbol>
      <symbol id="icon-cut" viewBox="0 0 24 24"><path d="M4 20 19 5"/><path d="M11 5h8v8"/></symbol>
      <symbol id="icon-dribble" viewBox="0 0 24 24"><path d="M3 20c1.5-3 3.5 1 5-2s3.5 1 5-2 3.5 1 5-2"/><path d="M15 6h5v5"/><path d="m20 6-3 3"/></symbol>
      <symbol id="icon-pass" viewBox="0 0 24 24"><path d="M4 20l2.5-2.5M9 15l2.5-2.5M14 10l2.5-2.5"/><path d="M11 5h8v8"/></symbol>
      <symbol id="icon-screen" viewBox="0 0 24 24"><path d="M5 19 15 9"/><path d="m11 5 8 8"/></symbol>
      <symbol id="icon-shot" viewBox="0 0 24 24"><path d="M3 21C4 11 10 5 15 6" stroke-dasharray="1 3.5"/><circle cx="18" cy="7" r="3.5"/></symbol>
      <symbol id="icon-freehand" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    </svg>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
