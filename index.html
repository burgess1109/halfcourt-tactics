<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="半場戰術板" />
    <title>半場戰術板</title>
  </head>
  <body data-screen="home">
    <!-- 首頁：選模式 -->
    <section id="home" class="screen home" aria-labelledby="home-title">
      <div class="home__inner">
        <h1 id="home-title" class="home__title">半場戰術板</h1>
        <p class="home__sub">3 對 3 半場籃球戰術</p>
        <button id="mode-offense" class="mode-card" type="button">
          <span class="mode-card__title">進攻模式</span>
          <span class="mode-card__desc">設定你的球隊，選擇或設計進攻戰術，系統負責防守</span>
        </button>
        <button class="mode-card" type="button" disabled>
          <span class="mode-card__title">防守模式</span>
          <span class="mode-card__desc">即將推出</span>
        </button>
        <button id="home-saved" class="btn home__saved" type="button">開啟已存的戰術</button>
      </div>
    </section>

    <!-- 設定流程：① 藍隊 ② 紅隊 ③ 對位 -->
    <section id="setup" class="screen setup" aria-labelledby="setup-title">
      <header class="setup__head">
        <p id="setup-progress" class="setup__progress">1 / 3</p>
        <!-- 從戰術面板進來時，改用分頁直接切換 -->
        <div id="setup-tabs" class="tabs" role="tablist" aria-label="球隊設定">
          <button class="tabs__tab" type="button" role="tab" data-step="1">藍隊</button>
          <button class="tabs__tab" type="button" role="tab" data-step="2">紅隊</button>
          <button class="tabs__tab" type="button" role="tab" data-step="3">站位與對位</button>
        </div>
        <h2 id="setup-title" class="setup__title"></h2>
        <p id="setup-hint" class="setup__hint"></p>
      </header>
      <form id="setup-form" class="setup__body" novalidate></form>
      <footer class="setup__foot">
        <p id="setup-error" class="setup__error" role="alert" hidden></p>
        <div class="setup__actions">
          <button id="setup-back" class="btn" type="button">上一步</button>
          <span class="toolbar__spacer"></span>
          <button id="setup-skip" class="btn" type="button">略過</button>
          <button id="setup-next" class="btn btn--primary" type="button">下一步</button>
        </div>
      </footer>
    </section>

    <div class="app screen">
      <!-- 直式在上方，橫式在左側 -->
      <nav class="toolbar toolbar--primary" aria-label="主要工具">
        <button id="saved" class="tool" type="button" data-tip="戰術列表：開啟、重新命名、複製、刪除、匯入匯出" aria-label="戰術列表">
          <svg aria-hidden="true"><use href="#icon-folder"/></svg>
        </button>
        <button id="library" class="tool" type="button" data-tip="戰術庫：推薦戰術、內建戰術、空白戰術" aria-label="戰術庫">
          <svg aria-hidden="true"><use href="#icon-library"/></svg>
        </button>
        <button id="play" class="tool" type="button" data-tip="播放（空白鍵）" aria-label="播放">
          <svg aria-hidden="true"><use href="#icon-play"/></svg>
        </button>
        <button id="team" class="tool" type="button" data-tip="球隊設定：藍隊、紅隊、對位" aria-label="球隊設定">
          <svg aria-hidden="true"><use href="#icon-team"/></svg>
        </button>
        <span class="toolbar__spacer"></span>
        <button id="share" class="tool" type="button" data-tip="分享：產生連結、下載 JSON 檔" aria-label="分享">
          <svg aria-hidden="true"><use href="#icon-share"/></svg>
        </button>
        <button id="save" class="tool" type="button" data-tip="存檔（⌘S / Ctrl+S）" aria-label="存檔">
          <svg aria-hidden="true"><use href="#icon-save"/></svg>
        </button>
        <button class="tool" type="button" data-tip="設定（即將推出）" aria-label="設定" disabled>
          <svg aria-hidden="true"><use href="#icon-settings"/></svg>
        </button>
      </nav>

      <main id="stage" class="stage">
        <canvas id="court" aria-label="半場球場，可以拖曳藍隊球員與球"></canvas>
        <div id="board-title" class="board-title" hidden></div>
        <!-- 分享連結的唯讀預覽 -->
        <div id="preview-bar" class="preview-bar" role="region" aria-label="唯讀預覽" hidden>
          <span class="preview-bar__text">
            <span class="preview-bar__label">分享的戰術・唯讀</span>
            <span id="preview-name" class="preview-bar__name"></span>
          </span>
          <button id="preview-save" class="btn btn--primary btn--small" type="button">另存</button>
          <button id="preview-close" class="btn btn--small" type="button">關閉</button>
        </div>
        <div id="hud" class="hud" aria-live="polite"></div>
        <section id="result" class="result" aria-labelledby="result-grade" hidden>
          <div class="result__head">
            <div id="result-grade" class="result__grade">A</div>
            <div class="result__summary">
              <div id="result-points" class="result__points"></div>
              <div class="result__hint">點評價可以跳到該分鏡</div>
            </div>
            <button id="result-close" class="result__close" type="button" data-tip="關閉評分" aria-label="關閉評分">✕</button>
          </div>
          <ol id="result-comments" class="result__comments"></ol>
        </section>
      </main>

      <!-- 直式在下方，橫式在右側 -->
      <nav class="toolbar toolbar--edit" aria-label="編輯工具">
        <button id="undo" class="tool tool--boxed" type="button" data-tip="復原（⌘Z / Ctrl+Z）" aria-label="復原" disabled>
          <svg aria-hidden="true"><use href="#icon-undo"/></svg>
        </button>
        <button id="redo" class="tool tool--boxed" type="button" data-tip="重做（⇧⌘Z / Ctrl+Y）" aria-label="重做" disabled>
          <svg aria-hidden="true"><use href="#icon-redo"/></svg>
        </button>
        <button id="clear" class="tool tool--boxed" type="button" data-tip="清空戰術：回到開局站位（保留球員與對位，可以復原）" aria-label="清空戰術">
          <svg aria-hidden="true"><use href="#icon-clear"/></svg>
        </button>
        <span class="toolbar__spacer"></span>
        <div class="frames" role="group" aria-label="分鏡">
          <button id="frame-prev" class="frames__btn" type="button" data-tip="上一個分鏡（←）" aria-label="上一個分鏡">‹</button>
          <button id="frame-label" class="frames__label" type="button" aria-haspopup="menu" aria-expanded="false" data-tip="分鏡選單：刪除這個分鏡">1 / 1</button>
          <button id="frame-next" class="frames__btn" type="button" data-tip="下一個分鏡（→）" aria-label="下一個分鏡">›</button>
          <button id="frame-add" class="frames__btn" type="button" data-tip="在後面新增分鏡" aria-label="在後面新增分鏡">＋</button>
        </div>
        <span class="toolbar__spacer"></span>
        <button id="tool" class="tool tool--boxed" type="button" data-tip="工具：移動" aria-label="工具：移動" aria-haspopup="menu" aria-expanded="false">
          <svg aria-hidden="true"><use href="#icon-move"/></svg>
          <span class="tool__badge" hidden>
            <svg aria-hidden="true"><use href="#icon-freehand"/></svg>
          </span>
        </button>
        <button id="delete" class="tool tool--boxed" type="button" data-tip="刪除選取的路線（Delete）" aria-label="刪除路線" disabled>
          <svg aria-hidden="true"><use href="#icon-trash"/></svg>
        </button>
      </nav>
    </div>
    <div id="tool-menu" class="menu" role="menu" aria-label="工具" hidden>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="move">
        <svg aria-hidden="true"><use href="#icon-move"/></svg>移動
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="cut">
        <svg aria-hidden="true"><use href="#icon-cut"/></svg>跑位
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="dribble">
        <svg aria-hidden="true"><use href="#icon-dribble"/></svg>運球
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="pass">
        <svg aria-hidden="true"><use href="#icon-pass"/></svg>傳球
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="screen">
        <svg aria-hidden="true"><use href="#icon-screen"/></svg>掩護
      </button>
      <button class="menu__item" type="button" role="menuitemradio" data-tool="shot">
        <svg aria-hidden="true"><use href="#icon-shot"/></svg>投籃
      </button>
      <hr class="menu__sep" />
      <button class="menu__item" type="button" role="menuitemcheckbox" data-freehand>
        <svg aria-hidden="true"><use href="#icon-freehand"/></svg>手繪
      </button>
    </div>

    <div id="frame-menu" class="menu" role="menu" aria-label="分鏡" hidden>
      <button id="frame-delete" class="menu__item" type="button" role="menuitem">
        <svg aria-hidden="true"><use href="#icon-trash"/></svg>刪除這個分鏡
      </button>
    </div>

    <dialog id="library-dialog" class="panel" aria-labelledby="library-title">
      <div class="panel__head">
        <h2 id="library-title" class="panel__title">戰術庫</h2>
        <button id="library-close" class="btn" type="button">關閉</button>
      </div>
      <div id="library-body" class="panel__body"></div>
    </dialog>

    <dialog id="saved-dialog" class="panel" aria-labelledby="saved-title">
      <div class="panel__head">
        <h2 id="saved-title" class="panel__title">戰術列表</h2>
        <div class="panel__actions">
          <button id="saved-import" class="btn" type="button">匯入 JSON</button>
          <button id="saved-close" class="btn" type="button">關閉</button>
        </div>
      </div>
      <input id="saved-file" type="file" accept=".json,application/json" hidden />
      <div id="saved-body" class="panel__body"></div>
    </dialog>

    <dialog id="name-dialog" class="panel panel--small" aria-labelledby="name-title">
      <form id="name-form" class="name-form" novalidate>
        <h2 id="name-title" class="panel__title">存檔</h2>
        <label class="name-form__field">
          <span>戰術名稱</span>
          <input id="name-input" type="text" maxlength="30" autocomplete="off" enterkeyhint="done" />
        </label>
        <p id="name-error" class="setup__error" role="alert" hidden></p>
        <div class="name-form__actions">
          <button id="name-cancel" class="btn" type="button">取消</button>
          <button id="name-ok" class="btn btn--primary" type="submit">存檔</button>
        </div>
      </form>
    </dialog>

    <dialog id="share-dialog" class="panel panel--small" aria-labelledby="share-title">
      <div class="panel__head">
        <h2 id="share-title" class="panel__title">分享</h2>
        <button id="share-close" class="btn" type="button">關閉</button>
      </div>
      <div class="panel__body share">
        <p class="share__hint">對方打開連結後是唯讀預覽，按「另存」才會存到他的戰術列表。</p>
        <input id="share-url" class="share__url" type="text" readonly aria-label="分享連結" />
        <div class="share__actions">
          <button id="share-copy" class="btn btn--primary" type="button">複製連結</button>
          <button id="share-native" class="btn" type="button" hidden>傳送到其他 App</button>
          <button id="share-json" class="btn" type="button">下載 JSON 檔</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
