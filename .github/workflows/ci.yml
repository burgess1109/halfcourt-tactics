# CI/CD（docs/PLANNING.md M9）
# - build：push 與 pull request 都會執行型別檢查、單元測試、打包；任何一步失敗就停止。
# - deploy：只有推到 main 且 build 成功時，把 dist/ 部署到 GitHub Pages。
#   第一次使用前要到 repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 也可以在 Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: read

# pull request 有新的 push 時，取消還在跑的舊檢查；main 不取消，避免部署做到一半被中斷
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vitest 5 需要 Node.js 22.12 以上
          node-version: 24
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 單元測試
        run: npm test

      - name: 打包
        run: npm run build

      # 只有要部署時才上傳（pull request 不需要）
      - name: 上傳部署檔
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 部署不要互相取消，避免網站停在部署到一半的狀態
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
